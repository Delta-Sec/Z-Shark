name: Sync GitHub Issues to Teams

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, closed, reopened, assigned]

jobs:
  notify-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Send Clean Adaptive Card to Teams
        env:
          TEAMS_WEBHOOK: ${{ secrets.IMS_WEBHOOK }}
          EVENT_TYPE: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          SENDER: ${{ github.actor }}
          ASSIGNEE: ${{ github.event.issue.assignee.login }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ACTION: ${{ github.event.action }}
        run: |
          # 1. تنظيف القيم وتجنب السطور الجديدة والقيم الفارغة
          CLEAN_BODY=$(echo "$ISSUE_BODY" | tr -d '\r' | sed 's/"/\\"/g' | tr '\n' ' ')
          CLEAN_COMMENT=$(echo "$COMMENT_BODY" | tr -d '\r' | sed 's/"/\\"/g' | tr '\n' ' ')
          
          BODY_TEXT="${CLEAN_BODY:-No description provided.}"
          ASSIGNEE_TEXT="${ASSIGNEE:-Unassigned}"
          LABELS_TEXT="${LABELS:-None}"

          if [ "$EVENT_TYPE" == "issue_comment" ]; then
            CARD_TITLE="💬 New Comment on Issue #$ISSUE_NUMBER"
            SUB_TEXT="**@$SENDER** commented: $CLEAN_COMMENT"
          else
            CARD_TITLE="📌 Issue #$ISSUE_NUMBER ($ACTION)"
            SUB_TEXT="**Status:** \`$ISSUE_STATE\` | **Updated by:** @$SENDER"
          fi

          # 2. بناء Adaptive Card متوافق 100% مع Teams Bot Framework
          PAYLOAD=$(jq -n \
            --arg title "$CARD_TITLE" \
            --arg issueTitle "$ISSUE_TITLE" \
            --arg issueUrl "$ISSUE_URL" \
            --arg subText "$SUB_TEXT" \
            --arg body "$BODY_TEXT" \
            --arg state "$ISSUE_STATE" \
            --arg assignee "$ASSIGNEE_TEXT" \
            --arg labels "$LABELS_TEXT" \
            '{
              "$schema": "http://adaptivecards.io/schemas/adaptivecard.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                {
                  "type": "TextBlock",
                  "text": $title,
                  "weight": "Bolder",
                  "size": "Medium",
                  "color": "Accent"
                },
                {
                  "type": "TextBlock",
                  "text": "[\($issueTitle)](\($issueUrl))",
                  "weight": "Bolder",
                  "size": "Large",
                  "wrap": true
                },
                {
                  "type": "TextBlock",
                  "text": "📋 **Status:** \($state)  |  👤 **Assignee:** \($assignee)  |  🏷️ **Labels:** \($labels)",
                  "wrap": true,
                  "spacing": "Small"
                },
                {
                  "type": "Container",
                  "style": "emphasis",
                  "items": [
                    {
                      "type": "TextBlock",
                      "text": "**Description:**",
                      "weight": "Bolder"
                    },
                    {
                      "type": "TextBlock",
                      "text": $body,
                      "wrap": true,
                      "isSubtle": true
                    }
                  ]
                },
                {
                  "type": "TextBlock",
                  "text": $subText,
                  "wrap": true,
                  "spacing": "Medium"
                }
              ],
              "actions": [
                {
                  "type": "Action.OpenUrl",
                  "title": "View Issue on GitHub",
                  "url": $issueUrl
                }
              ]
            }')

          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK"
